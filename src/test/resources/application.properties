spring.datasource.url=jdbc:h2:mem:omnichannel_auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.mail.host=localhost
spring.mail.port=1025
app.staff.mail.from=no-reply@test.local
app.staff.mail.login-url=http://localhost:5173/login
app.cloudinary.cloud-name=
app.cloudinary.api-key=
app.cloudinary.api-secret=
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
app.auth.cookie-secure=false
app.auth.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
