# Cookies are sent only through HTTPS in production.
app.auth.cookie-secure=true
app.auth.cookie-same-site=Lax
app.auth.allowed-origin-patterns=${ALLOWED_ORIGIN_PATTERNS}

# Public production URLs.
app.marketplace.callback-base-url=${MARKETPLACE_CALLBACK_BASE_URL}
app.staff.mail.login-url=${TENANT_LOGIN_URL}

# Caddy terminates HTTPS and forwards requests to this application.
server.forward-headers-strategy=framework

# Expose health endpoint only.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Do not expose interactive API documentation publicly.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Do not expose implementation details to clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never