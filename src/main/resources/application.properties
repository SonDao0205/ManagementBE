spring.application.name=backend
server.port=8081

# Database connection configuration (MySQL Localhost)
spring.datasource.url=jdbc:mysql://localhost:3306/omnichannel_pos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Tenant authentication. The browser receives only this opaque HttpOnly cookie.
app.auth.cookie-name=omni_tenant_session
app.auth.session-duration=PT8H
app.auth.cookie-secure=false
app.auth.cookie-same-site=Lax
app.auth.max-login-attempts=5
app.auth.lock-duration=PT15M
app.auth.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
