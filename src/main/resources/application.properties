spring.application.name=backend

# Database connection configuration (MySQL Localhost)
spring.datasource.url=jdbc:mysql://localhost:3306/omnichannel_pos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway configuration
spring.flyway.baseline-on-migrate=true

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT configuration
# Secret key is a 256-bit (32-byte) hex-encoded key for HS256 algorithm
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiry time in milliseconds (e.g., 86400000 ms = 24 hours)
app.jwt.expiration-ms=86400000
