spring.application.name=backend
server.port=${PORT:8081}

# PostgreSQL is the only runtime database. Flyway creates the schema and seed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/omnichannel_pos}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Tenant authentication. The browser receives only this opaque HttpOnly cookie.
app.auth.cookie-name=omni_tenant_session
app.auth.session-duration=PT8H
app.auth.cookie-secure=false
app.auth.cookie-same-site=Lax
app.auth.max-login-attempts=5
app.auth.lock-duration=PT15M
app.auth.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# Marketplace OAuth. Credentials must come from environment variables.
app.marketplace.callback-base-url=${MARKETPLACE_CALLBACK_BASE_URL:http://localhost:8081}
app.marketplace.authorization-ttl=PT10M
app.marketplace.credential-encryption-key=${MARKETPLACE_CREDENTIAL_ENCRYPTION_KEY:}
app.marketplace.tiktok.base-url=${TIKTOK_BASE_URL:http://localhost:4011}
app.marketplace.tiktok.client-id=${TIKTOK_CLIENT_ID:omni-tiktok-local}
app.marketplace.tiktok.client-secret=${TIKTOK_CLIENT_SECRET:}
app.marketplace.lazada.base-url=${LAZADA_BASE_URL:http://localhost:4012}
app.marketplace.lazada.client-id=${LAZADA_CLIENT_ID:omni-lazada-local}
app.marketplace.lazada.client-secret=${LAZADA_CLIENT_SECRET:}
# Tự kéo sản phẩm và đơn hàng mới từ các shop đã liên kết mỗi 30 giây.
app.marketplace.sync-interval-ms=${MARKETPLACE_SYNC_INTERVAL_MS:30000}
app.marketplace.sync-initial-delay-ms=${MARKETPLACE_SYNC_INITIAL_DELAY_MS:30000}

# Product images/videos are uploaded by the backend so the API secret never
# reaches browser JavaScript. Values are available in Cloudinary Console.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:omnichannel-pos}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

# SMTP for first-login credentials of CSKH staff accounts.
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}
app.staff.mail.from=${STAFF_MAIL_FROM:}
app.staff.mail.login-url=${TENANT_LOGIN_URL:http://localhost:5173/login}

# Weekly tenant financial analytics email (previous Monday through Sunday).
app.analytics.weekly-email-enabled=${ANALYTICS_WEEKLY_EMAIL_ENABLED:true}
app.analytics.weekly-email-cron=${ANALYTICS_WEEKLY_EMAIL_CRON:0 0 8 * * MON}
app.analytics.weekly-email-zone=${ANALYTICS_WEEKLY_EMAIL_ZONE:Asia/Ho_Chi_Minh}
app.analytics.mail.from=${ANALYTICS_MAIL_FROM:}

# Internal AI gateway. AI_SERVICE_TOKEN must match AI_backend and never reaches the browser.
app.ai.base-url=${AI_BACKEND_URL:http://localhost:8083}
app.ai.service-token=${AI_SERVICE_TOKEN:}

# Internal Chat Backend command used to scan one pending message when Autopilot starts.
app.chat-backend.base-url=${CHAT_BACKEND_URL:http://localhost:8082}
app.chat-backend.service-token=${CHAT_BACKEND_SERVICE_TOKEN:}
