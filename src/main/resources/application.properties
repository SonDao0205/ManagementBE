spring.application.name=backend
server.port=8081

# PostgreSQL is the only runtime database. Flyway creates the schema and seed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/omnichannel_pos}
spring.datasource.username=${DB_USERNAME:mac}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Tenant authentication. The browser receives only this opaque HttpOnly cookie.
app.auth.cookie-name=omni_tenant_session
app.auth.session-duration=PT8H
app.auth.cookie-secure=false
app.auth.cookie-same-site=Lax
app.auth.max-login-attempts=5
app.auth.lock-duration=PT15M
app.auth.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# Local marketplace simulator OAuth.
app.marketplace.callback-base-url=http://localhost:8081
app.marketplace.authorization-ttl=PT10M
# Local-only AES-256 key. Replace before deploying outside a developer machine.
app.marketplace.credential-encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.marketplace.tiktok.base-url=http://localhost:4011
app.marketplace.tiktok.client-id=omni-tiktok-local
app.marketplace.tiktok.client-secret=tiktok-local-secret-change-me
app.marketplace.lazada.base-url=http://localhost:4012
app.marketplace.lazada.client-id=omni-lazada-local
app.marketplace.lazada.client-secret=lazada-local-secret-change-me
# Tự kéo sản phẩm và đơn hàng mới từ các shop đã liên kết mỗi 5 giây.
app.marketplace.sync-interval-ms=${MARKETPLACE_SYNC_INTERVAL_MS:5000}
app.marketplace.sync-initial-delay-ms=${MARKETPLACE_SYNC_INITIAL_DELAY_MS:3000}

